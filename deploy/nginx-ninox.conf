# /etc/nginx/sites-available/ninoX.dryorc.site
# symlink into sites-enabled, then: certbot --nginx -d ninoX.dryorc.site

server {
    listen 80;
    server_name ninoX.dryorc.site;

    client_max_body_size 20m;

    # backend API, same origin as the frontend so the browser never has to deal with CORS
    location /api/ {
        proxy_pass http://127.0.0.1:5068/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # the streaming endpoints send X-Accel-Buffering: no themselves, but a
        # generous read timeout keeps nginx from cutting off a slow/long reply
        proxy_read_timeout 3600s;
    }

    # everything else goes to the Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
